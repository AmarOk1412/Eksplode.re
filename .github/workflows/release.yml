name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build, test and publish a release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set the package version from the tag
        run: sh scripts/set-version.sh "${GITHUB_REF_NAME}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check commit-msg hook itself
        run: sh .githooks/test-commit-msg.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Build and size-check the WebAssembly render module
        run: sh scripts/build-wasm.sh

      - name: Run web client JS test suite
        working-directory: crates/web/js-tests
        run: node --test

      - name: Run terminal Enter-key integration check
        run: python3 scripts/pty-enter-check.py

      - name: Check acceptance-scenario test coverage
        run: sh scripts/check-scenarios.sh

      - name: Build release binaries
        run: cargo build --workspace --release

      - name: Package release archive
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          stage="eksplode-re-${tag}-linux-x86_64"
          mkdir -p "${stage}"
          cp target/release/eksplode-re-cli "${stage}/"
          cp target/release/eksplode-re-server "${stage}/"
          if [ -d crates/web/assets ]; then
            cp -r crates/web/assets "${stage}/assets"
          fi
          tar czf "${stage}.tar.gz" "${stage}"
          echo "ARCHIVE_PATH=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Generate release notes (current tag only)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }} --latest --strip header
        env:
          OUTPUT: /tmp/release-notes.md

      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: /tmp/CHANGELOG.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          files: ${{ env.ARCHIVE_PATH }}

      - name: Commit the version bump and the updated CHANGELOG.md to main
        continue-on-error: true
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # the tagged tree was bumped for the build; redo it on top of main
          git checkout -- Cargo.toml Cargo.lock
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          sh scripts/set-version.sh "${GITHUB_REF_NAME}"
          git add Cargo.toml Cargo.lock
          if git diff --cached --quiet -- Cargo.toml Cargo.lock; then
            echo "Cargo.toml already at ${GITHUB_REF_NAME#v}, nothing to commit."
          else
            git commit -m "build: set the version to ${GITHUB_REF_NAME#v}"
          fi
          cp /tmp/CHANGELOG.md CHANGELOG.md
          git add CHANGELOG.md
          if git diff --cached --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already up to date, nothing to commit."
          else
            git commit -m "docs: update CHANGELOG.md for ${GITHUB_REF_NAME}"
          fi
          git push origin main
