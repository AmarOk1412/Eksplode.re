name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check commit-msg hook itself
        run: sh .githooks/test-commit-msg.sh

      - name: Build workspace
        run: cargo build --workspace

      - name: Run Rust test suite
        run: cargo test --workspace

      - name: Build and size-check the WebAssembly render module
        run: sh scripts/build-wasm.sh

      - name: Run web client JS test suite
        working-directory: crates/web/js-tests
        run: node --test

      - name: Run terminal Enter-key integration check
        run: python3 scripts/pty-enter-check.py

      - name: Check acceptance-scenario test coverage
        run: sh scripts/check-scenarios.sh
