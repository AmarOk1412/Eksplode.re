[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Bot soak tests simulate thousands of matches; keep the hot crates optimised in dev and test builds.
[profile.dev.package.eksplode-re-core]
opt-level = 3

[profile.dev.package.eksplode-re-bots]
opt-level = 3

# Small WebAssembly build of the render module, see scripts/build-wasm.sh.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
codegen-units = 1
