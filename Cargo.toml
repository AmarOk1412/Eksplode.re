[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Bot soak tests simulate thousands of matches; keep the hot crates optimised in dev and test builds.
[profile.dev.package.bomberust-core]
opt-level = 3

[profile.dev.package.bomberust-bots]
opt-level = 3
