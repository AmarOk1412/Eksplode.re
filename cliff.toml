[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
{% if version %}\
    ## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
# This project's commit-msg hook (.githooks/commit-msg) enforces "part: short
# desc" subjects instead of Conventional Commits, so group by that convention.
conventional_commits = false
filter_unconventional = false
commit_parsers = [
    { message = "^core:", group = "Core" },
    { message = "^bots:", group = "Bots" },
    { message = "^net:", group = "Networking" },
    { message = "^cli:", group = "CLI" },
    { message = "^web:", group = "Web" },
    { message = "^render:", group = "Rendering" },
    { message = "^build:", group = "Build" },
    { message = "^docs:", group = "Documentation" },
    { message = "^test:", group = "Testing" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
