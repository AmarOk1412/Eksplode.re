[package]
name = "eksplode-re-web-render"
description = "Isometric graphics of Eksplode.re as a WebAssembly module (and a native library for tests)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "eksplode_re_web_render"
crate-type = ["cdylib", "rlib"]

[dependencies]
eksplode-re-core = { path = "../core", features = ["serde"] }
serde_json = "1"

# ffi.rs opts out of the unsafe lint: see the module comment.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[dev-dependencies]
serde_json = "1"
