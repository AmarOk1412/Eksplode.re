[package]
name = "bomberust-core"
description = "Pure, deterministic Bomberman rules: no I/O, no rendering, no networking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bomberust_core"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1"
