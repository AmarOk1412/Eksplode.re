<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bomberust</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="app">
    <header>
      <h1>Bomberust</h1>
      <p id="notice" role="status" aria-live="polite">Loading...</p>
    </header>

    <section id="join-panel" class="menu">
      <canvas id="logo" aria-hidden="true"></canvas>
      <label for="name">Your name</label>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false">
      <button id="join" type="button">Join Game</button>
      <button id="retry" type="button" hidden>Retry</button>
    </section>

    <section id="editor" class="dialog editor" aria-label="Character editor" hidden>
      <canvas id="preview" class="preview" aria-label="Preview of your character"></canvas>
      <div class="pickers">
        <h2>Your character</h2>
        <div id="swatches" class="swatches" role="group" aria-label="Colour"></div>
        <label for="gender">Look</label>
        <select id="gender"></select>
        <label for="head">Head</label>
        <select id="head"></select>
        <label for="face">Face</label>
        <select id="face"></select>
        <div class="buttons">
          <button id="random-look" type="button">Random</button>
          <button id="done-look" type="button" hidden>Done</button>
        </div>
      </div>
    </section>

    <section id="lobby-panel" class="dialog" hidden>
      <h2>Lobby</h2>
      <ul id="slots" class="cards"></ul>
      <div class="buttons">
        <button id="start" type="button">Start (Enter)</button>
        <button id="add-bot" type="button">Add bot</button>
        <button id="remove-bot" type="button">Remove bot</button>
        <button id="ready" type="button">Ready</button>
        <button id="change-look" type="button">Change look</button>
      </div>
      <p class="hint">The first human player is the owner and starts the match.
Controls: arrow keys or WASD to move, Space or E for a bomb, Z or Q to punch a bomb (needs the punch power).</p>
    </section>

    <section id="game-panel" hidden>
      <div id="timer" aria-label="Time left"></div>
      <canvas id="view" aria-label="Game arena"></canvas>
      <ul id="hud" class="slots"></ul>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
