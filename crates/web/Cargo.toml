[package]
name = "bomberust-web"
description = "Web server for Bomberust: serves the page and bridges WebSocket players to the match host."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "bomberust_web"

[[bin]]
name = "bomberust-server"
path = "src/main.rs"

[dependencies]
bomberust-core = { path = "../core", features = ["serde"] }
bomberust-net = { path = "../net" }
bomberust-bots = { path = "../bots" }
serde_json = "1"
tungstenite = "0.30"
ctrlc = "3"

[dev-dependencies]
# Only for the documentation tests, which compare the CLI help text with the guides.
bomberust-cli = { path = "../cli" }
# The consistency test compares the look options of the renderer with the server and the page.
bomberust-web-render = { path = "../web-render" }

[lints]
workspace = true
