[package]
name = "eksplode-re-net"
description = "Network play for Eksplode.re: protocol, authoritative host and client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "eksplode_re_net"

[dependencies]
eksplode-re-core = { path = "../core", features = ["serde"] }
eksplode-re-bots = { path = "../bots" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
argon2 = "0.5"
subtle = "2"

[lints]
workspace = true
